<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e3be">
<title>Туған күніңмен!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --u:min(1vw,.5625dvh);               /* 1% ширины кадра */
    --cream:#f6ebd3; --paper:#f3e3be; --brown:#5a2f18; --wine:#8e2a20;
    --gold:#d4a33a; --gold2:#f4d47a; --gold3:#b8821f;
    --serif:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:#e2d2ab;display:flex;justify-content:center;font-family:var(--serif);color:var(--brown)}

  .frame{position:relative;height:100dvh;width:min(100vw,calc(100dvh*9/16));overflow:hidden;background:var(--paper);
    box-shadow:0 0 40px rgba(90,47,24,.25)}
  .stage{position:absolute;inset:0;perspective:1600px}
  .card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.5,.05,.2,1)}
  .card.is-flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
  .back{transform:rotateY(180deg)}

  /* сцена */
  #scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ch{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite;animation-delay:var(--d,0s)}
  .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite;animation-delay:var(--d,0s)}
  .sp{transform-box:fill-box;transform-origin:center;opacity:0;animation:floatUp var(--t,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
  @keyframes breathe{0%,100%{transform:scale(1,1) rotate(-.7deg)}50%{transform:scale(1.012,1.022) rotate(.7deg)}}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%{transform:scaleY(1)}}
  @keyframes floatUp{0%{opacity:0;transform:translateY(12px) scale(.4) rotate(0)}
    20%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.05) rotate(40deg)}}

  .paper{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(255,240,200,0) 50%,rgba(120,60,20,.28) 100%)}

  /* заголовок */
  .title{position:absolute;left:calc(50% - var(--u)*47);top:calc(var(--u)*3.5);pointer-events:none;
    width:calc(var(--u)*94);text-align:center;padding:calc(var(--u)*2.4) calc(var(--u)*3);
    border-radius:calc(var(--u)*4);
    background:linear-gradient(180deg,#a83026 0%,#7a1f22 55%,#5e1519 100%);
    box-shadow:0 0 0 calc(var(--u)*.5) #f4d47a,0 0 0 calc(var(--u)*1.1) #7a1f22,0 0 0 calc(var(--u)*1.6) #d4a33a,0 calc(var(--u)*1.2) calc(var(--u)*2.5) rgba(60,20,10,.45),inset 0 0 calc(var(--u)*3) rgba(0,0,0,.35);
    opacity:0;animation:titleIn 2.4s .5s ease-out forwards}
  .title h1{font-weight:700;font-size:calc(var(--u)*12.6);line-height:1.05;letter-spacing:.01em;white-space:nowrap;
    background:linear-gradient(100deg,#ffe9a0 0%,#fff8d8 30%,#f4d47a 50%,#fff1b8 70%,#e6b64e 100%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 calc(var(--u)*.4) 0 rgba(40,10,5,.8));animation:gold 6s linear infinite}
  .title i{display:block;margin:calc(var(--u)*.4) auto 0;width:calc(var(--u)*40);height:calc(var(--u)*2.4)}
  @keyframes titleIn{0%{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}

  /* кнопка */
  .btn{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*6);transform:translateX(-50%);
    width:calc(var(--u)*72);padding:calc(var(--u)*4) 0;border:0;border-radius:999px;cursor:pointer;overflow:hidden;z-index:5;
    font-family:var(--serif);font-weight:700;font-size:calc(var(--u)*6.4);letter-spacing:.02em;color:#4a2410;
    background:linear-gradient(180deg,#f8dd8b 0%,#d9a53c 55%,#c08a25 100%);
    box-shadow:0 0 0 2px #8a5a14,0 0 0 5px #f6e2a4,0 8px 18px rgba(90,47,24,.45),inset 0 2px 0 rgba(255,255,255,.7);
    text-shadow:0 1px 0 rgba(255,240,190,.8);transition:transform .15s}
  .btn:active{transform:translateX(-50%) scale(.97)}
  .btn::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);
    animation:shine 3.2s ease-in-out infinite}
  @keyframes shine{0%,35%{left:-40%}75%,100%{left:130%}}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:4px}

  /* сертификат */
  .cert{position:absolute;inset:calc(var(--u)*5) calc(var(--u)*5) calc(var(--u)*24);
    border:calc(var(--u)*.8) solid var(--gold3);border-radius:calc(var(--u)*3);
    background:linear-gradient(160deg,#fff8e4,#f6e7bf);
    box-shadow:inset 0 0 0 calc(var(--u)*2) #f6e7bf,inset 0 0 0 calc(var(--u)*2.7) var(--gold),0 10px 30px rgba(90,47,24,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:calc(var(--u)*7) calc(var(--u)*6);gap:calc(var(--u)*2.6)}
  .cert .orn{width:calc(var(--u)*30);height:calc(var(--u)*6)}
  .cert .kicker{font-size:calc(var(--u)*4.6);letter-spacing:.28em;text-transform:uppercase;color:var(--gold3);font-weight:700}
  .cert .hb{font-size:calc(var(--u)*8.6);font-weight:700;color:var(--wine);font-style:italic;line-height:1}
  .cert .sum{font-weight:700;line-height:.95;font-size:calc(var(--u)*21);letter-spacing:.01em;margin-top:calc(var(--u)*1);
    background:linear-gradient(100deg,#9c6b12 0%,#f6dc8c 20%,#c9952a 40%,#fff1b8 55%,#b8821f 75%,#f0cd6a 100%);
    font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:gold 4s linear infinite;filter:drop-shadow(0 1px 0 rgba(90,47,24,.55))}
  .cert .unit{font-size:calc(var(--u)*8);font-weight:700;color:var(--wine);letter-spacing:.2em;text-transform:uppercase}
  .cert .sub{font-size:calc(var(--u)*5.6);font-weight:600;line-height:1.2;color:var(--brown);max-width:90%}
  .cert .seal{width:calc(var(--u)*17);height:calc(var(--u)*17);margin-top:calc(var(--u)*1)}
  @keyframes gold{to{background-position:-250% 0}}


  /* --- забег и объятия --- */
  .mv{animation:kmove 2.8s cubic-bezier(.2,.55,.45,1) var(--rd,0s) both}
  .lean{transform-origin:0 0;animation:lean 2.8s ease-in-out var(--rd,0s) both}
  .hop{transform-origin:0 0;animation:var(--hn,hop) .28s ease-in-out var(--rd,0s) 10}
  .legA{--amp:28deg;animation:strideA .56s ease-in-out var(--rd,0s) 5}
  .legB{--amp:28deg;animation:strideB .56s ease-in-out var(--rd,0s) 5}
  .armA{--amp:42deg;animation:strideB .56s ease-in-out var(--rd,0s) 5,hugArm .6s ease-out var(--hd,3s) forwards}
  .armB{--amp:42deg;animation:strideA .56s ease-in-out var(--rd,0s) 5,hugArm .6s ease-out var(--hd,3s) forwards}
  .head{animation:tilt .7s ease-out var(--hd,3s) forwards}
  .skirt{animation:skirtSw .28s ease-in-out var(--rd,0s) 10 alternate}
  .marmL{transform-origin:158px 218px;animation:momL 5s ease-in-out both}
  .marmR{transform-origin:222px 218px;animation:momR 5s ease-in-out both}
  .fam{transform-origin:190px 520px;animation:fam 4.6s ease-in-out 4.8s infinite}
  .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:popUp 2s ease-out var(--dl,4s) both}
  @keyframes kmove{from{transform:translateX(var(--sx))}to{transform:translateX(0)}}
  @keyframes lean{0%,85%{transform:rotate(var(--ln))}100%{transform:rotate(0)}}
  @keyframes hop{50%{transform:translateY(-10px)}}
  @keyframes waddle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
  @keyframes strideA{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(var(--amp))}75%{transform:rotate(calc(var(--amp) * -1))}}
  @keyframes strideB{0%,50%,100%{transform:rotate(0)}25%{transform:rotate(calc(var(--amp) * -1))}75%{transform:rotate(var(--amp))}}
  @keyframes hugArm{to{transform:rotate(var(--h))}}
  @keyframes tilt{to{transform:rotate(var(--tl))}}
  @keyframes skirtSw{from{transform:scaleX(.94) rotate(-2deg)}to{transform:scaleX(1.06) rotate(2deg)}}
  @keyframes momL{0%,28%{transform:rotate(0)}44%,64%{transform:rotate(20deg)}78%{transform:rotate(30deg)}86%{transform:rotate(34deg)}100%{transform:rotate(30deg)}}
  @keyframes momR{0%,28%{transform:rotate(0)}44%,64%{transform:rotate(-20deg)}78%{transform:rotate(-30deg)}86%{transform:rotate(-34deg)}100%{transform:rotate(-30deg)}}
  @keyframes fam{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg) translateY(-1.5px)}}
  @keyframes popUp{0%{opacity:0;transform:translateY(8px) scale(.2)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:translateY(-70px) scale(.9)}}


  /* --- оборот: современная сцена --- */
  #scene2{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .pr{opacity:0}
  .card.is-flipped .pr{animation:rise .9s cubic-bezier(.2,.7,.2,1) calc(var(--rd,0s) + .6s) both}
  .pi{transform-box:fill-box;transform-origin:50% 100%;animation:pidle 5.2s ease-in-out infinite;animation-delay:var(--d,0s)}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite;animation-delay:var(--d,0s)}
  .tw{transform-box:fill-box;transform-origin:center;opacity:0;animation:twinkle var(--t,4s) ease-in-out infinite;animation-delay:var(--dl,0s)}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes pidle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.012)}}
  @keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
  @keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
  .dim{position:absolute;inset:0;background:rgba(60,38,20,.5);opacity:0;pointer-events:none;transition:opacity .6s}
  .dim.show{opacity:1}
  .cert{opacity:0;transform:scale(.82) translateY(24px);pointer-events:none;
    transition:opacity .7s ease .2s,transform .9s cubic-bezier(.2,.8,.2,1) .2s}
  .cert.show{opacity:1;transform:none}


  /* --- кнопка музыки --- */
  .snd{position:absolute;right:calc(var(--u)*2);bottom:calc(env(safe-area-inset-bottom,0px) + var(--u)*8.6);z-index:6;
    width:calc(var(--u)*9);height:calc(var(--u)*9);padding:calc(var(--u)*1.8);border-radius:50%;border:0;cursor:pointer;color:#5a2f18;
    background:linear-gradient(180deg,#f8dd8b,#d9a53c);box-shadow:0 0 0 2px #8a5a14,0 4px 10px rgba(90,47,24,.4)}
  .snd .off{display:none}
  .snd.muted .off{display:block}
  .snd.muted{opacity:.75}
  .snd:focus-visible{outline:3px solid #fff;outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .ch,.eyes,.sp,.btn::after,.cert .sum{animation:none}
    .sp{opacity:.8}
    .card{transition-duration:.01s}
    .title{animation-duration:.01s;animation-delay:0s}
    .mv,.lean,.hop,.legA,.legB,.skirt,.fam,.pop{animation:none}
    .armA,.armB{animation:none;transform:rotate(var(--h))}
    .head{animation:none;transform:rotate(var(--tl))}
    .pr{opacity:1!important;animation:none!important}
    .pi,.sway{animation:none}
    .tw{animation:none;opacity:.6}
    .marmL{animation:none;transform:rotate(30deg)}
    .marmR{animation:none;transform:rotate(-30deg)}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .40  0 0 0 0 .27  0 0 0 0 .13  0 0 0 1.1 -.32"/>
    </filter>
  </defs>
</svg>

<main class="frame">
  <div class="stage">
    <div class="card" id="card">

      <!-- ЛИЦЕВАЯ СТОРОНА -->
      <section class="face front" aria-label="Праздничная открытка">
        <svg id="scene" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="Мультяшная иллюстрация: мама и четверо детей в казахских национальных костюмах в юрте"></svg>
        <svg class="paper" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)" opacity=".55"/></svg>
        <div class="vignette"></div>
        <div class="title">
          <h1>Туған күніңмен!</h1>
          <i><svg viewBox="0 0 120 10" width="100%" height="100%" aria-hidden="true"><path d="M2 5H46M74 5H118" stroke="#f4d47a" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M60 0L64 5L60 10L56 5Z" fill="#f4d47a" stroke="#fff3c4" stroke-width=".6"/><circle cx="50" cy="5" r="1.6" fill="#f4d47a"/><circle cx="70" cy="5" r="1.6" fill="#f4d47a"/></svg></i>
        </div>
      </section>

      <!-- ОБОРОТ: СЕРТИФИКАТ -->
      <section class="face back" aria-label="Оборот открытки">
        <svg id="scene2" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="Современная иллюстрация: семья в белых и коричневых нарядах у золотой арки с цветами"></svg>
        <div class="dim" id="dim"></div>
        <div class="cert" id="cert">
          <svg class="orn" viewBox="0 0 120 20" aria-hidden="true"><path d="M4 10H44M76 10H116" stroke="#b8821f" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M60 2L68 10L60 18L52 10Z" fill="#d4a33a" stroke="#8a5a14" stroke-width="1"/><path d="M46 10C46 4 54 4 54 8M74 10C74 4 66 4 66 8" fill="none" stroke="#b8821f" stroke-width="1.4" stroke-linecap="round"/></svg>
          <div class="kicker">Подарочный сертификат</div>
          <div class="hb">Туған күніңмен!</div>
          <div class="sum">30&nbsp;000</div>
          <div class="unit">баллов</div>
          <svg class="orn" viewBox="0 0 120 20" aria-hidden="true"><path d="M4 10H116" stroke="#b8821f" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round"/><path d="M60 3L62.5 8L68 10L62.5 12L60 17L57.5 12L52 10L57.5 8Z" fill="#d4a33a" stroke="#8a5a14" stroke-width=".8"/></svg>
          <div class="sub">На любой SPA-салон и процедуры по твоему выбору</div>
          <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
            <defs><radialGradient id="sg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff1b8"/><stop offset=".6" stop-color="#d9a53c"/><stop offset="1" stop-color="#a8741a"/></radialGradient></defs>
            <path d="M50 4l8 7 10-3 5 9 10 2 1 10 8 6-4 9 4 9-8 6-1 10-10 2-5 9-10-3-8 7-8-7-10 3-5-9-10-2-1-10-8-6 4-9-4-9 8-6 1-10 10-2 5-9 10 3z" fill="url(#sg)" stroke="#8a5a14" stroke-width="2"/>
            <circle cx="50" cy="50" r="27" fill="none" stroke="#8a5a14" stroke-width="1.5" stroke-dasharray="2 3"/>
            <path d="M50 66C28 52 34 36 44 38C47 39 49 42 50 45C51 42 53 39 56 38C66 36 72 52 50 66Z" fill="#8e2a20" stroke="#5a2f18" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
      </section>

    </div>
  </div>
  <button class="btn" id="btn" type="button" aria-pressed="false">Перевернуть открытку</button>
  <button class="snd" id="snd" type="button" aria-label="Включить или выключить музыку" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="18" r="2.6" fill="currentColor"/><circle cx="17" cy="16" r="2.6" fill="currentColor"/><path class="off" d="M3 3L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
(function(){
  'use strict';
  /* ---------- хелперы рисования ---------- */
  var INK='#3a2418', SK='#F2C9A0', HR='#2a1a12';
  function E(x,y,a,b){return 'M'+(x-a)+' '+y+'a'+a+' '+b+' 0 1 0 '+(2*a)+' 0a'+a+' '+b+' 0 1 0 '+(-2*a)+' 0z';}
  function R(x,y,w,h,r){r=r||0;return 'M'+(x+r)+' '+y+'h'+(w-2*r)+'a'+r+' '+r+' 0 0 1 '+r+' '+r+'v'+(h-2*r)+'a'+r+' '+r+' 0 0 1 '+(-r)+' '+r+'h'+(-(w-2*r))+'a'+r+' '+r+' 0 0 1 '+(-r)+' '+(-r)+'v'+(-(h-2*r))+'a'+r+' '+r+' 0 0 1 '+r+' '+(-r)+'z';}
  /* заливка со сдвигом 2px от контура — эффект ламповой печати */
  function P(d,f,sw){return '<path d="'+d+'" fill="'+f+'" transform="translate(2.2 1.8)"/>'+
    '<path d="'+d+'" fill="none" stroke="'+INK+'" stroke-width="'+(sw||1.6)+'" stroke-linejoin="round" stroke-linecap="round"/>';}
  function L(d,c,w){return '<path d="'+d+'" fill="none" stroke="'+(c||INK)+'" stroke-width="'+(w||1.4)+'" stroke-linecap="round" stroke-linejoin="round"/>';}
  function T(a,x,y,s){return '<g transform="rotate('+a+' '+x+' '+y+')">'+s+'</g>';}
  function H(x,y,s,f){return P('M'+x+' '+(y+s*.6)+'C'+(x-s*1.3)+' '+(y-s*.2)+' '+(x-s*.6)+' '+(y-s*1.1)+' '+x+' '+(y-s*.4)+
    'C'+(x+s*.6)+' '+(y-s*1.1)+' '+(x+s*1.3)+' '+(y-s*.2)+' '+x+' '+(y+s*.6)+'z',f,1);}
  /* пушистый мех: овал с волнистым краем */
  function FUR(x,y,a,b,n,f){
    var d='',i,a0,a1,am,p=function(t,k){return (x+Math.cos(t)*a*k).toFixed(1)+' '+(y+Math.sin(t)*b*k).toFixed(1);};
    for(i=0;i<n;i++){a0=2*Math.PI*i/n;a1=2*Math.PI*(i+1)/n;am=(a0+a1)/2;
      d+=(i?'':'M'+p(a0,1))+'Q'+p(am,1.16)+' '+p(a1,1);}
    return P(d+'z',f,1.4);
  }
  function face(x,y,r,m,d){
    var s=P(E(x,y,r,r*1.06),SK);
    s+='<ellipse cx="'+(x-r*.55)+'" cy="'+(y+r*.32)+'" rx="'+(r*.21)+'" ry="'+(r*.12)+'" fill="#E98A7B" opacity=".6"/>'+
       '<ellipse cx="'+(x+r*.55)+'" cy="'+(y+r*.32)+'" rx="'+(r*.21)+'" ry="'+(r*.12)+'" fill="#E98A7B" opacity=".6"/>';
    s+='<g class="eyes" style="--d:'+(d||0)+'s"><ellipse cx="'+(x-r*.38)+'" cy="'+(y-r*.02)+'" rx="'+(r*.09)+'" ry="'+(r*.13)+'" fill="#2a1a12"/>'+
       '<ellipse cx="'+(x+r*.38)+'" cy="'+(y-r*.02)+'" rx="'+(r*.09)+'" ry="'+(r*.13)+'" fill="#2a1a12"/></g>';
    if(m==='open'){
      s+='<path d="M'+(x-r*.3)+' '+(y+r*.42)+'Q'+x+' '+(y+r*.98)+' '+(x+r*.3)+' '+(y+r*.42)+'Z" fill="#B5413A" stroke="'+INK+'" stroke-width="1.1" stroke-linejoin="round"/>';
    }else if(m==='calm'){
      s+=L('M'+(x-r*.2)+' '+(y+r*.5)+'Q'+x+' '+(y+r*.58)+' '+(x+r*.2)+' '+(y+r*.5),INK,1.2);
    }else{
      s+=L('M'+(x-r*.27)+' '+(y+r*.42)+'Q'+x+' '+(y+r*.7)+' '+(x+r*.27)+' '+(y+r*.42),m==='lip'?'#B5413A':INK,1.4);
    }

    (function frame(){
      confetti({particleCount:5,angle:60,spread:60,origin:{x:0,y:.8},colors:colors,zIndex:1000});
      confetti({particleCount:5,angle:120,spread:60,origin:{x:1,y:.8},colors:colors,zIndex:1000});
      if(Date.now()<end){requestAnimationFrame(frame);}
    })();
    setTimeout(function(){confetti({particleCount:90,spread:120,startVelocity:32,gravity:.8,origin:{x:.5,y:.4},colors:colors,zIndex:1000});},700);
  }
  var cert=document.getElementById('cert'), dim=document.getElementById('dim');
  var stage=0, labels=['Перевернуть открытку','Получить подарок','Смотреть сначала'];
  function go(n){
    stage=n;
    card.classList.toggle('is-flipped',n>=1);
    cert.classList.toggle('show',n===2);
    dim.classList.toggle('show',n===2);
    if(n===0){setTimeout(render,650);}      /* лицевая сторона проиграется заново */
    btn.textContent=labels[n];
    btn.setAttribute('aria-pressed',n>0?'true':'false');
  }
  btn.addEventListener('click',function(){
    if(stage===0){go(1);}
    else if(stage===1){go(2);burst();}
    else{go(0);}
  });
  if(location.hash==='#back'){go(1);} else if(location.hash==='#gift'){go(2);}
})();
</script>
</body>
</html>
